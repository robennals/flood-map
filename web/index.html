<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>California Flood Map</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@4/dist/pmtiles.js"></script>
<script src="config.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; color: #1d2329; }
  #map { position: absolute; inset: 0; -webkit-touch-callout: none; user-select: none; }
  #hint { position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%); z-index: 3; max-width: 80%;
          background: rgba(30, 41, 59, .92); color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 13px;
          text-align: center; pointer-events: none; }
  #panel { position: absolute; top: 10px; left: 10px; width: min(440px, calc(100% - 20px)); z-index: 2;
           background: #fff; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.18); padding: 10px; }
  form { display: flex; gap: 6px; }
  input[type=search] { flex: 1; min-width: 0; padding: 7px 9px; font-size: 14px; border: 1px solid #b9c0c7; border-radius: 6px; }
  #panel button { padding: 7px 11px; font-size: 14px; border: 0; border-radius: 6px; background: #1d4ed8; color: #fff;
                  cursor: pointer; }
  .maplibregl-popup-close-button { color: #475569; font-size: 18px; padding: 0 6px; }
  .maplibregl-popup-close-button:hover { color: #1d2329; background: #f1f5f9; }
  .legend { margin-top: 8px; display: flex; gap: 1px; flex-wrap: wrap; }
  #panel .legend button { background: none; color: #1d2329; padding: 3px 4px; font-size: 12.5px; white-space: nowrap;
                   border: 1px solid transparent; }
  #panel .legend button:hover, #panel .legend button[aria-expanded=true] { border-color: #cbd5e1; background: #f8fafc; }
  .swatch { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 4px; vertical-align: -1px;
            border: 1px solid rgba(0,0,0,.12); }
  #levelInfo, #claimsInfo { margin-top: 6px; padding: 8px 10px; background: #f8fafc; border-radius: 8px; font-size: 13px; }
  #claimsInfo { position: relative; padding-right: 28px; }
  #claimsInfo p { margin: 4px 0 0; }
  #panel #closeClaims { position: absolute; top: 4px; right: 4px; background: none; color: #475569; font-size: 18px;
                        padding: 0 6px; line-height: 1.2; }
  #levelInfo p { margin: 0 0 6px; }
  #levelInfo ul { margin: 4px 0 0; padding-left: 18px; }
  .row { margin-top: 8px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  #panel .row button { background: #334155; padding: 5px 10px; font-size: 13px; }
  .maplibregl-popup-content { font: 13px/1.4 system-ui, sans-serif; padding: 9px 26px 9px 11px; max-width: 250px; }
  /* Phones: three short rows (search; key; buttons and links) so the map keeps the screen.
     The key wraps to a second line only on the narrowest phones. */
  @media (max-width: 600px) {
    body { font-size: 13px; }
    #panel { top: 6px; left: 6px; right: 6px; width: auto; padding: 6px; border-radius: 8px; }
    input[type=search], #panel form button { padding: 5px 8px; font-size: 14px; }
    .legend { margin-top: 4px; gap: 0; }
    #panel .legend button { padding: 2px; font-size: 11px; }
    .legend .swatch { width: 9px; height: 9px; margin-right: 2px; }
    .row { margin-top: 4px; gap: 10px; font-size: 12px; flex-wrap: nowrap; white-space: nowrap; }
    #panel .row button { padding: 3px 8px; font-size: 12px; }
    #levelInfo, #claimsInfo { font-size: 12px; padding: 6px 8px; }
  }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-weight: 600; color: #fff; margin-bottom: 3px; }
  .popup-line { margin: 3px 0 0; }
</style>
</head>
<body>
<div id="map"></div>
<div id="hint" hidden></div>
<div id="panel">
  <form id="search"><input type="search" id="q" placeholder="Enter a California address" autocomplete="street-address"
    aria-label="Address"><button>Check</button></form>
  <div class="legend" id="legend"></div>
  <div id="levelInfo" hidden></div>
  <div id="claimsInfo" hidden></div>
  <div class="row">
    <button id="toggle3d" type="button">Show in 3D</button>
    <a href="about.html">How it works</a>
    <a href="what-to-do.html">What to do</a>
  </div>
</div>
<script>
const LEVELS = {
  4: { name: "Higher", color: "#b91c1c",
       meaning: "Inside a flood zone that an official study expects to flood about once in 100 years or more often: FEMA's current or upcoming maps, or California's maps of streams FEMA never studied." },
  3: { name: "Elevated", color: "#f97316",
       meaning: "Low ground: less than about 1 m (3 ft) above the flood level of a nearby high-risk zone, or less than 1.5 m (5 ft) above the nearest creek or river. Also land protected by levees: it floods only if a levee is overtopped or fails, but then flooding can be sudden and deep." },
  2: { name: "Moderate", color: "#fcd34d",
       meaning: "Fairly low ground: less than about 3 m (10 ft) above the flood level of a nearby high-risk zone, or less than 4 m (13 ft) above the nearest creek or river." },
  1: { name: "Lower", color: "#f1f5f9",
       meaning: "None of the above. Lower is not no risk: heavy rain can overwhelm storm drains on any street." },
};
const KEY = [
  ...[4, 3, 2, 1].map(level => ({ ...LEVELS[level], shape: "square" })),
  { name: "Past flood", short: "Floods", color: "#60a5fa", shape: "square",
    meaning: "An area that really flooded, from Santa Clara Valley Water District's records (Coyote Creek 2017, San Francisquito Creek 1998 and 2023, and others). Records from other counties aren't included yet." },
  { name: "Insurance claims", short: "Claims", color: "#1d4ed8", shape: "circle",
    meaning: "Flood insurance claims filed since 1995, from FEMA. Each circle is one neighbourhood (census block group); bigger means more claims. Only insured homes file claims, so more homes may have flooded." },
];

// Each source is its own layer of shapes; a spot's level is the highest level of any layer it falls in.
// The short reason shown in the popup comes from that highest layer.
const SOURCES = [
  ["fema_high", 4, "In FEMA's 100-year flood zone."],
  ["prelim_high", 4, "In FEMA's upcoming 100-year flood zone."],
  ["dwr_awareness", 4, "In a state-mapped floodplain along a stream FEMA never studied."],
  ["levee_often_overtopped", 4, "Protected by a levee that the Army Corps of Engineers expects to be overtopped more often than once in 100 years."],
  ["levee", 3, "Protected by a levee. It floods only if the levee is overtopped or fails, but then flooding can be sudden and deep."],
  ["terrain_elevated", 3, "Low ground near a flood zone, creek or river."],
  ["terrain_moderate", 2, "A few metres above a nearby flood zone, creek or river."],
];
const COLORS = { 4: "#b91c1c", 3: "#f97316", 2: "#fcd34d" };
// Lighter tints of the same colours for street-level zoom, so the map isn't overwhelming up close
const TINTS = { 4: "#e7a4a4", 3: "#fcbf96", 2: "#fde9a6" };

// Colour key: each entry is a button that opens what it means (short labels keep it on one line)
const PHONE = window.matchMedia("(max-width: 600px)").matches;
const legend = document.getElementById("legend"), levelInfo = document.getElementById("levelInfo");
for (const entry of KEY) {
  const button = document.createElement("button");
  button.type = "button";
  button.setAttribute("aria-expanded", "false");
  button.innerHTML = `<span class="swatch" style="background:${entry.color}${entry.shape === "circle" ? ";border-radius:50%" : ""}"></span>${entry.short || entry.name}`;
  button.addEventListener("click", () => {
    const opening = button.getAttribute("aria-expanded") === "false";
    for (const b of legend.children) b.setAttribute("aria-expanded", "false");
    levelInfo.hidden = !opening;
    if (!opening) return;
    button.setAttribute("aria-expanded", "true");
    levelInfo.innerHTML = `<p><b>${entry.name}:</b> ${entry.meaning}</p>`;
  });
  legend.append(button);
}

const protocol = new pmtiles.Protocol();
maplibregl.addProtocol("pmtiles", protocol.tile);
const CONFIG = window.FLOOD_MAP_CONFIG;
const DATA_BASE = (new URLSearchParams(location.search).get("data") === "local" ? "data" : CONFIG.dataUrl)
  + `/${CONFIG.region}/`;

const map = new maplibregl.Map({
  container: "map",
  attributionControl: { compact: true },
  style: "https://tiles.openfreemap.org/styles/positron",
  bounds: [[-124.5, 32.5], [-114.1, 42.0]],  // all of California, at whatever zoom fits the screen
});
// Zoom buttons make zooming obvious ("Back to flat map" resets rotation and tilt, so no compass)
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), PHONE ? "bottom-right" : "top-right");
// Rotation is only allowed in 3D; with no compass, a rotated flat map would have no way back
function allowRotation(allowed) {
  if (allowed) {
    map.dragRotate.enable(); map.touchZoomRotate.enableRotation(); map.keyboard.enableRotation();
  } else {
    map.dragRotate.disable(); map.touchZoomRotate.disableRotation(); map.keyboard.disableRotation();
  }
}
allowRotation(false);
map.on("load", () => {
  map.addSource("risk", { type: "vector", url: `pmtiles://${new URL(DATA_BASE + "risk.pmtiles", location.href)}` });
  const firstSymbol = map.getStyle().layers.find(l => l.type === "symbol")?.id;
  // Solid fills go under the basemap's roads so streets stay readable
  const underStreets = "tunnel_motorway_casing";
  // Free elevation tiles (AWS Open Data "Terrain Tiles"), used for hill shading and 3D
  const dem = { type: "raster-dem", tiles: ["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"],
                encoding: "terrarium", tileSize: 256, maxzoom: 15,
                attribution: "Elevation: <a href='https://registry.opendata.aws/terrain-tiles/'>AWS Terrain Tiles</a>" };
  map.addSource("dem", dem);
  map.addSource("dem3d", dem);  // MapLibre recommends a separate source for 3D terrain
  map.addLayer({ id: "coverage", type: "line", source: "risk", "source-layer": "coverage",
                 paint: { "line-color": "#475569", "line-width": 1.5, "line-dasharray": [3, 2] } }, firstSymbol);
  // Draw lowest levels first so higher levels paint on top
  for (const [name, level] of [...SOURCES].reverse()) {
    map.addLayer({ id: name, type: "fill", source: "risk", "source-layer": name,
                   paint: { "fill-color": ["interpolate", ["linear"], ["zoom"], 12, COLORS[level], 15, TINTS[level]] } },
                 underStreets);
  }
  map.addSource("history", { type: "vector", url: `pmtiles://${new URL(DATA_BASE + "history.pmtiles", location.href)}` });
  map.addLayer({ id: "past_floods_fill", type: "fill", source: "history", "source-layer": "past_floods",
                 paint: { "fill-color": "#60a5fa", "fill-opacity": 0.45 } }, firstSymbol);
  map.addLayer({ id: "past_floods_line", type: "line", source: "history", "source-layer": "past_floods",
                 paint: { "line-color": "#1d4ed8", "line-width": 2 } }, firstSymbol);
  // The neighbourhood behind a claims circle, outlined only while that circle's popup is open
  map.addLayer({ id: "claim_area", type: "line", source: "history", "source-layer": "claim_areas",
                 filter: ["==", ["get", "geoid"], ""],
                 paint: { "line-color": "#1d4ed8", "line-width": 2.5, "line-dasharray": [2, 1.5] } }, firstSymbol);
  map.addLayer({ id: "claims", type: "circle", source: "history", "source-layer": "claims",
                 paint: { "circle-color": "#1d4ed8", "circle-opacity": 0.8, "circle-stroke-color": "#fff", "circle-stroke-width": 1.5,
                          "circle-radius": ["interpolate", ["linear"], ["sqrt", ["get", "claims"]], 1, 4, 10, 18] } }, firstSymbol);
  map.addLayer({ id: "hillshade", type: "hillshade", source: "dem",
                 paint: { "hillshade-exaggeration": 0.45, "hillshade-shadow-color": "#3b3226",
                          "hillshade-highlight-color": "#ffffff", "hillshade-accent-color": "#5a4a35" } }, underStreets);
});

// Point-in-polygon against the coverage outline (drawn as a line, so clicks inside it don't hit it)
function insideCoverage(lngLat) {
  const [x, y] = [lngLat.lng, lngLat.lat];
  return map.querySourceFeatures("risk", { sourceLayer: "coverage" }).some(f => {
    const polygons = f.geometry.type === "Polygon" ? [f.geometry.coordinates] : f.geometry.coordinates;
    return polygons.some(rings => rings.reduce((inside, ring) => {
      let crossings = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const [xi, yi] = ring[i], [xj, yj] = ring[j];
        if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) crossings = !crossings;
      }
      return inside !== crossings;
    }, false));
  });
}

// The level at a spot, and the one-line reason for it
function levelAt(lngLat) {
  const point = map.project(lngLat);
  const box = [[point.x - 1, point.y - 1], [point.x + 1, point.y + 1]];
  if (!insideCoverage(lngLat)) return { name: "No data here yet", color: "#64748b",
    reason: "This map covers land in California. There's no data over the ocean, the Bay or large lakes." };
  const hitNames = new Set(map.queryRenderedFeatures(box, { layers: SOURCES.map(s => s[0]) }).map(f => f.layer.id));
  const top = SOURCES.filter(([name]) => hitNames.has(name)).sort((a, b) => b[1] - a[1])[0];
  if (!top) return { ...LEVELS[1], color: "#94a3b8", reason: "No flood source is mapped here." };
  return { ...LEVELS[top[1]], reason: top[2] };
}

// A note when the spot is inside a recorded past flood
function pastFloodNote(point) {
  const flood = map.queryRenderedFeatures([[point.x - 1, point.y - 1], [point.x + 1, point.y + 1]], { layers: ["past_floods_fill"] })[0];
  return flood ? `<p class="popup-line">Flooded${flood.properties.year ? " in " + flood.properties.year : ""} (${flood.properties.creek}).</p>` : "";
}

let popup;
function showPopup(lngLat, html) {
  popup?.remove();
  hideClaims();
  // Closing is handled by the click handler below, so the click after a long press doesn't close it at once
  popup = new maplibregl.Popup({ maxWidth: "260px", focusAfterOpen: false, closeOnClick: false }).setLngLat(lngLat).setHTML(html).addTo(map);
}
function showLevel(lngLat) {
  const at = levelAt(lngLat);
  showPopup(lngLat, `<span class="badge" style="background:${at.color};color:${at.name === "Moderate" ? "#1d2329" : "#fff"}">${at.name}</span>
    <p class="popup-line">${at.reason}</p>${pastFloodNote(map.project(lngLat))}`);
}

// Clicking a claims circle describes that neighbourhood's claims instead of the ground under it
function claimsAt(point) {
  const pad = 6;
  return map.queryRenderedFeatures([[point.x - pad, point.y - pad], [point.x + pad, point.y + pad]], { layers: ["claims"] })[0] || null;
}
// A circle's report goes in the panel rather than a popup, so it doesn't cover the outlined neighbourhood
const claimsInfo = document.getElementById("claimsInfo");
function showClaims(claims) {
  popup?.remove();
  const n = claims.properties.claims;
  claimsInfo.innerHTML = `<button id="closeClaims" type="button" aria-label="Close" title="Close">&times;</button>
    <span class="badge" style="background:#1d4ed8">Past flood damage</span>
    <p><b>${n} insurance claim${n > 1 ? "s" : ""}</b> in the outlined neighbourhood since 1995: ${claims.properties.years}.</p>
    <p style="color:#59636e">Only insured homes file claims. The claims came from somewhere inside the dashed outline,
    not necessarily where the circle is.</p>`;
  claimsInfo.hidden = false;
  document.getElementById("closeClaims").addEventListener("click", hideClaims);
  map.setFilter("claim_area", ["==", ["get", "geoid"], claims.properties.geoid]);
}
function hideClaims() {
  if (claimsInfo.hidden) return;
  claimsInfo.hidden = true;
  map.setFilter("claim_area", ["==", ["get", "geoid"], ""]);
}

// Flood events (claims circles and past-flood areas) open with a click or tap. Anywhere else, pressing and
// holding a spot shows its flood risk, so clicking, tapping and dragging around the map don't open popups.
function pastFloodAt(point) {
  return map.queryRenderedFeatures([[point.x - 1, point.y - 1], [point.x + 1, point.y + 1]], { layers: ["past_floods_fill"] })[0] || null;
}
function showPastFlood(lngLat, flood) {
  const year = flood.properties.year ? " in " + flood.properties.year : "";
  showPopup(lngLat, `<span class="badge" style="background:#1d4ed8">Past flood</span>
    <p class="popup-line">Flooded${year} (${flood.properties.creek}, Santa Clara Valley Water District records).</p>
    <p class="popup-line" style="color:#59636e">Press and hold to see the flood risk here.</p>`);
}
function showFloodEventAt(point, lngLat) {
  const claims = claimsAt(point);
  if (claims) return showClaims(claims);
  const flood = pastFloodAt(point);
  if (flood) showPastFlood(lngLat, flood);
}

const TOUCH = window.matchMedia("(pointer: coarse)").matches;
const LONG_PRESS_MS = 500, LONG_PRESS_SLOP_PX = 10;
let pressTimer = null, pressStart = null, pressFired = false;
// Phones also send imitation mouse events after a touch; ignore those so they don't restart the press
let lastTouch = 0;
const recentTouch = () => Date.now() - lastTouch < 1000;
function cancelPress() { clearTimeout(pressTimer); pressTimer = null; }
function startPress(point, lngLat) {
  cancelPress();
  pressFired = false;
  pressStart = point;
  pressTimer = setTimeout(() => { pressTimer = null; pressFired = true; hideHint(); showLevel(lngLat); }, LONG_PRESS_MS);
}
function movePress(point) { if (pressTimer && point.dist(pressStart) > LONG_PRESS_SLOP_PX) cancelPress(); }

map.on("click", e => {
  if (pressFired) { pressFired = false; return; }  // the click browsers send when a long press ends
  // With a popup or a circle's report open, a click elsewhere only closes it (another circle opens that one instead)
  if (popup?.isOpen()) { popup.remove(); return; }
  if (!claimsInfo.hidden && !claimsAt(e.point)) { hideClaims(); return; }
  showFloodEventAt(e.point, e.lngLat);
});
map.on("touchstart", e => {
  lastTouch = Date.now();
  if (e.points.length === 1) startPress(e.point, e.lngLat); else cancelPress();  // two fingers: pinch
});
map.on("touchmove", e => { lastTouch = Date.now(); if (e.points.length === 1) movePress(e.point); else cancelPress(); });
map.on("touchend", () => { lastTouch = Date.now(); cancelPress(); });
map.on("touchcancel", cancelPress);
map.on("mousedown", e => { if (e.originalEvent.button === 0 && !recentTouch()) startPress(e.point, e.lngLat); });
// While the map is dragged with a mouse it sends no mousemove events, so cancel when a mouse drag starts
map.on("dragstart", () => { if (!recentTouch()) cancelPress(); });
map.on("mousemove", e => {
  movePress(e.point);
  map.getCanvas().style.cursor = claimsAt(e.point) || pastFloodAt(e.point) ? "pointer" : "";
});
map.on("mouseup", cancelPress);

// Tapping or clicking the panel closes any open popup
document.getElementById("panel").addEventListener("pointerdown", () => popup?.remove());

// First visit: say how to see the risk at a spot
const hint = document.getElementById("hint");
function hideHint() { hint.hidden = true; }
if (!localStorage.getItem("longPressHintShown")) {
  hint.textContent = `${TOUCH ? "Press" : "Click"} and hold anywhere to see the flood risk there`;
  localStorage.setItem("longPressHintShown", "1");
  hint.hidden = false;
  setTimeout(hideHint, 6000);
  // Any first interaction (dragging, pinching, clicking or tapping the panel, typing) means they've started
  for (const type of ["pointerdown", "touchstart", "keydown"])
    window.addEventListener(type, hideHint, { once: true, capture: true });
}

document.getElementById("search").addEventListener("submit", async e => {
  e.preventDefault();
  const q = document.getElementById("q").value;
  // Only search inside California, so a street name shared with another state can't land there
  const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&viewbox=-124.5,42.0,-114.1,32.5&bounded=1&q=${encodeURIComponent(q)}`;
  const [hit] = await (await fetch(url)).json();
  if (!hit) { alert("Couldn't find that address."); return; }
  const lngLat = new maplibregl.LngLat(Number(hit.lon), Number(hit.lat));
  map.flyTo({ center: lngLat, zoom: 15, duration: 0 });
  map.once("idle", () => showLevel(lngLat));
});

document.getElementById("toggle3d").addEventListener("click", e => {
  const on = !map.getTerrain();
  map.setTerrain(on ? { source: "dem3d", exaggeration: 1.5 } : null);
  map.easeTo(on ? { pitch: 60, duration: 800 } : { pitch: 0, bearing: 0, duration: 800 });
  allowRotation(on);
  e.target.textContent = on ? "Back to flat map" : "Show in 3D";
});
</script>
</body>
</html>
